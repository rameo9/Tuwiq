# Nginx — tuwaiqapex.com
# انسخ إلى: /etc/nginx/conf.d/tuwaiqapex.conf
# ثم: sudo nginx -t && sudo systemctl reload nginx
#
# الشهادة موجودة مسبقاً من certbot:
#   /etc/letsencrypt/live/tuwaiqapex.com/fullchain.pem
#   /etc/letsencrypt/live/tuwaiqapex.com/privkey.pem

# إعادة توجيه HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tuwaiqapex.com www.tuwaiqapex.com;
    return 301 https://$host$request_uri;
}

# الموقع (Next.js على المنفذ 3000 — PM2: tuwiq)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tuwaiqapex.com www.tuwaiqapex.com;

    client_max_body_size 25m;

    ssl_certificate     /etc/letsencrypt/live/tuwaiqapex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuwaiqapex.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

